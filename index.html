<style>
:root{--navy:#0B2D5B;--gold:#D4AF37;--gray:#E5E7EB;--off:#F5F5F5;--ink:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;font-family:Manrope,Inter,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.65;overflow-x:hidden}
a{color:inherit}h1,h2,h3{line-height:1.12;margin:0 0 .5em}
.w{max-width:1160px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--gray)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;color:var(--navy);letter-spacing:.04em}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--navy);display:grid;place-items:center;color:var(--gold);font-style:normal}
.logo small{display:block;font-size:9px;letter-spacing:.2em;color:#6b7280;font-weight:600}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 11px;text-decoration:none;font-size:14px;font-weight:600;color:var(--navy);border-bottom:2px solid transparent}
nav a.on,nav a:hover{border-color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:var(--navy);padding:13px 24px;font-weight:800;text-decoration:none;border:0;border-radius:4px;cursor:pointer;font:inherit;font-weight:800;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:none;border:1.5px solid var(--gold);color:#fff}.btn.n{background:var(--navy);color:#fff}
#bg{display:none;background:none;border:0;font-size:26px;color:var(--navy)}
@media(max-width:960px){#bg{display:block}nav{position:absolute;left:0;right:0;top:72px;background:#fff;border-bottom:1px solid var(--gray);display:none;padding:10px 22px}nav.open{display:block}nav ul{flex-direction:column}.hc{display:none}}
.dk{background:var(--navy);color:#fff}.lt{background:var(--off)}
section{padding:84px 0}
.ey{color:var(--gold);letter-spacing:.22em;font-size:12px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ey:before{content:"";width:34px;height:2px;background:var(--gold)}
h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.hero{padding:96px 0 80px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(40px,7vw,84px);font-weight:800;letter-spacing:-.02em}.hero h1 b{color:var(--gold)}
.hero p{max-width:600px;color:#d6deec}
.hg{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center}
@media(max-width:860px){.hg{grid-template-columns:1fr}.hero svg{max-width:260px}}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:34px;align-items:start}
.ln{border-top:3px solid var(--gold);padding-top:18px}
.dk .ln p,.dk p{color:#d6deec}
.ic{font-size:26px;color:var(--gold)}
.pg{padding:64px 0 54px}.pg h1{font-size:clamp(34px,5vw,56px);margin:0}
.st{display:grid;grid-template-columns:56px 1fr;gap:6px 16px;padding:18px 0;border-bottom:1px solid rgba(212,175,55,.35)}
.st b{color:var(--gold);font-size:22px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tb button{padding:10px 18px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:700;cursor:pointer;border-radius:4px}
.tb button.on{background:var(--navy);color:#fff}
.pr{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--gray);font-size:15px}
.pr span:last-child{font-weight:800;color:var(--navy);white-space:nowrap;text-align:right}
.gt{font-weight:800;color:var(--navy);margin:22px 0 4px;border-left:4px solid var(--gold);padding-left:10px}
.nt{font-size:13px;color:#4b5563;margin-top:14px}.dk .nt{color:#b8c4da}
.cd{background:#fff;border:1px solid var(--gray);padding:26px;border-radius:4px}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,#10407f,var(--navy));display:grid;place-items:center;color:var(--gold);font-size:48px;font-weight:800;border-bottom:3px solid var(--gold);position:relative}
.ph small{position:absolute;bottom:8px;font-size:11px;color:#b8c4da;font-weight:500}
.tm{cursor:pointer;background:#fff;border:1px solid var(--gray);padding:0;text-align:left;font:inherit;border-radius:4px;overflow:hidden}
.tm div.i{padding:16px}.tm:hover{box-shadow:0 8px 24px rgba(11,45,91,.15)}
dialog{max-width:560px;width:92%;border:0;border-radius:6px;padding:28px}dialog::backdrop{background:rgba(11,45,91,.7)}
details{border:1px solid var(--gray);margin-bottom:10px;background:#fff;border-radius:4px}
summary{padding:16px 20px;font-weight:800;color:var(--navy);cursor:pointer}
details ol{padding:0 20px 14px 42px;margin:0}details li{margin-bottom:8px}details ul{margin:4px 0}
.em{border:2px dashed var(--gold);padding:48px 24px;text-align:center;border-radius:6px;background:var(--off)}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #cbd2dc;border-radius:4px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.er{color:#b91c1c;font-size:13px;min-height:1em}
.so a{display:inline-block;margin:0 8px 8px 0;padding:8px 14px;border:1px solid var(--gold);border-radius:30px;text-decoration:none;font-size:14px;font-weight:700}
.dk .so a:hover{background:var(--gold);color:var(--navy)}
footer{padding:60px 0 28px}footer a{display:block;text-decoration:none;color:#d6deec;padding:3px 0}footer a:hover{color:var(--gold)}footer h4{color:var(--gold);margin:0 0 10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px}
.cp{border-top:1px solid rgba(255,255,255,.15);margin-top:36px;padding-top:18px;font-size:13px;color:#b8c4da}
.rv{animation:u .6s both}@keyframes u{from{opacity:0;transform:translateY(16px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.tw{overflow-x:auto}
.sv{display:flex;flex-direction:column}.sv>p{margin:0 0 24px}.sv>.btn{margin-top:auto;align-self:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}.row>div:first-child{flex:1 1 360px}.row p{margin:0}
.ab{display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:start}.sk{position:sticky;top:100px}.pq{border-left:3px solid var(--gold);padding:6px 0 6px 18px;margin-top:22px;font-size:18px;font-weight:700;color:var(--navy);font-style:italic}.tx p{margin:0 0 18px}.lead{font-size:19px;font-weight:600;color:var(--navy)}
@media(max-width:860px){.ab{grid-template-columns:1fr;gap:20px}.sk{position:static}}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}.vc{display:flex;flex-direction:column;padding:24px}.vl{width:54px;height:54px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:28px;font-weight:800;border-radius:6px;margin-bottom:14px}.vc h3{font-size:18px;margin:0;color:var(--navy)}.vc p{margin:8px 0 0;font-size:15px}
.ph{aspect-ratio:4/5;overflow:hidden;border-radius:6px 6px 0 0}.ph img{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover!important;object-position:50% 80%!important}
.tg{display:flex;flex-wrap:wrap;justify-content:center;gap:26px}.tm{flex:0 1 calc(33.333% - 18px);min-width:260px;display:flex;flex-direction:column}.tm .i{flex:1;display:flex;flex-direction:column;border-top:3px solid var(--gold)}.tm .i div:last-child{margin-top:auto!important;padding-top:12px}
@media(max-width:700px){.tm{flex-basis:100%}}
.cb{text-align:center;border-top:3px solid var(--gold);margin-top:40px;padding-top:36px}.cb p{margin:0 0 18px;font-weight:700;color:var(--navy);font-size:20px}
</style><style id="fx">
@keyframes fxIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fxDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fxDrop{0%{opacity:0;transform:translateY(-40px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fxShine{to{background-position:200% 0}}
@keyframes fxDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,40px) scale(1.15)}}
@keyframes fxLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fxMenu{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fxDlg{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
/* progress + header */
#fxp{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--gold),#f3dc86);transform:scaleX(0);transform-origin:0 50%;pointer-events:none}
header{transition:box-shadow .3s}header.scrolled{box-shadow:0 10px 28px -16px rgba(11,45,91,.5)}
.nav{transition:height .3s}.logo img{transition:height .3s}
header.scrolled .nav{height:60px}header.scrolled .logo img{height:38px!important}
@media(max-width:960px){header.scrolled nav{top:60px}nav.open{animation:fxMenu .25s ease}}
nav a{transition:border-color .25s,color .25s}
#app.fxpg{animation:fxFade .4s ease}
/* scroll reveal */
.js .fx{opacity:0}
.js .fx.in{opacity:1;animation:fxIn .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0ms)}
.ey:before{transform-origin:left;animation:fxLine .8s .15s cubic-bezier(.2,.7,.2,1) backwards}
.pg .ey,.pg h1{animation:fxIn .7s cubic-bezier(.2,.7,.2,1) backwards}.pg h1{animation-delay:.1s}
/* hero */
.hero>.w{position:relative;z-index:1}
.hero:before{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.24),transparent 65%);animation:fxDrift 12s ease-in-out infinite alternate;pointer-events:none}
.hero h1 b{background:linear-gradient(90deg,#D4AF37,#f6e08a,#D4AF37);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:fxShine 4s linear infinite}
/* buttons */
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s}
.btn:after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s;pointer-events:none}
.btn:hover{box-shadow:0 12px 24px -10px rgba(212,175,55,.65)}.btn.n:hover{box-shadow:0 12px 24px -10px rgba(11,45,91,.5)}
.btn:hover:after{left:140%}.btn:active{transform:scale(.97)}
/* cards & rows */
.ln,div.cd,.vc,.tm{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.ic{transition:transform .3s;transform-origin:0 50%}.vl{transition:background .3s,color .3s,transform .3s}
.ph img{transition:transform .6s ease}
.tb button{transition:transform .2s,background .2s,color .2s}.tb button:hover{transform:translateY(-2px)}
.so a{transition:transform .2s,background .2s,color .2s}.so a:hover{transform:translateY(-3px)}
footer a{transition:color .2s,transform .2s}footer a:hover{transform:translateX(5px)}
.st b{transition:transform .3s;transform-origin:0 50%}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
details[open] ol{animation:fxFade .4s ease}
dialog[open]{animation:fxDlg .3s ease}dialog[open]::backdrop{animation:fxFade .3s ease}
@media(hover:hover){
.ln:hover{transform:translateY(-5px)}.ln:hover .ic{transform:scale(1.18) rotate(-6deg)}
div.cd:hover,.vc:hover,.tm:hover{transform:translateY(-6px);box-shadow:0 18px 36px -16px rgba(11,45,91,.38);border-color:var(--gold)}
.vc:hover .vl{background:var(--gold);color:var(--navy);transform:rotate(-6deg)}
.tm:hover .ph img{transform:scale(1.07)}
.ln:hover,div.cd:hover,.vc:hover,.tm:hover{background-image:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(212,175,55,.16),transparent 70%)}
.pr{transition:background .25s,padding .25s}.pr:hover{background:rgba(212,175,55,.1);padding-left:8px;padding-right:8px}
.st:hover>b{transform:scale(1.18)}
}
/* logo hero */
@keyframes lgGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes lgBreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}
@keyframes lgDrop{0%{opacity:0;transform:translateY(-46px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes lgDotP{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes lgSweep{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes lgGold{from{opacity:0;transform:translate(-16px,16px)}to{opacity:1;transform:none}}
@keyframes lgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes lgPulse{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes lgSpin{to{transform:rotate(360deg)}}
.lg{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin-inline:auto;display:grid;place-items:center}
.hero .lg svg{max-width:none}
.lg-glow{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.32),rgba(212,175,55,.09) 45%,transparent 70%);animation:lgPulse 4.5s ease-in-out infinite;pointer-events:none}
.lg-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lg-r1{transform-origin:150px 150px;animation:lgSpin 40s linear infinite}
.lg-r2{transform-origin:150px 150px;animation:lgSpin 26s linear infinite reverse}
.lg-tilt{position:relative;width:68%;transition:transform .25s ease-out;will-change:transform}
.lg-icon{display:block;width:100%;height:auto;overflow:visible;animation:lgFloat 6s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
.lg-icon path{transform-box:fill-box}
.lp-sw{transform-origin:0 50%;animation:lgSweep 1.2s .1s cubic-bezier(.2,.8,.2,1) backwards}
.lp-b{transform-origin:50% 100%;animation:lgGrow .9s cubic-bezier(.2,.8,.2,1) backwards,lgBreath 3.4s ease-in-out infinite}
.lp-b1{animation-delay:.35s,1.6s}.lp-b2{animation-delay:.5s,2s}.lp-b3{animation-delay:.65s,2.4s}
.lp-dot{transform-origin:50% 50%;animation:lgDrop .9s 1s cubic-bezier(.3,1.5,.5,1) backwards,lgDotP 3s ease-in-out 2.2s infinite}
.lp-g{animation:lgGold 1s 1.1s ease-out backwards}
@media(max-width:860px){.lg{max-width:290px}}
@media(prefers-reduced-motion:reduce){.js .fx{opacity:1}}
</style>

["Rama Raditya Handaka","Chief Executive Officer (CEO) & Finance Lead",["Menetapkan visi, misi, dan arah strategis lembaga konsultasi data.","Mengambil keputusan penting terkait tarif layanan, kemitraan, perekrutan konsultan, dan perluasan layanan.","Memimpin dan memantau kinerja seluruh divisi agar target lembaga tercapai.","Mewakili lembaga dalam hubungan dengan klien besar, institusi, dan mitra kerja sama.","Bertanggung jawab atas keuangan lembaga: penyusunan anggaran, pengelolaan arus kas, serta pencatatan deposit dan pelunasan.","Menjaga etika profesi, reputasi, dan kepatuhan lembaga terhadap aturan yang berlaku.","Menyusun dan memperbarui SOP agar layanan tetap tertib dan efisien."]],
["Alexandra Maulina Firdausi","Client Relations & Marketing Manager",["Menjadi pintu pertama komunikasi klien dan menangani pertanyaan awal dengan cepat dan sopan.","Mengelola formulir identitas dan kebutuhan analisis klien.","Mengonfirmasi permasalahan, tujuan penelitian, dan luaran yang diharapkan klien.","Melakukan negosiasi biaya dan memastikan deposit diterima sesuai kesepakatan.","Merencanakan dan menjalankan strategi pemasaran, seperti promosi media sosial, kerja sama kampus, dan strategi jemput bola untuk mencari klien baru.","Mengelola jadwal konsultasi serta menghubungkan klien dengan tim konsultan.","Mengumpulkan evaluasi kepuasan klien dan menindaklanjutinya sebagai bahan perbaikan layanan."]],
["Fatih Satwiko Anwar","Project & Operations Manager",["Menyusun jadwal proyek, tenggat waktu, dan pembagian tugas seluruh tim.","Memantau progres setiap proyek klien agar selesai tepat waktu sesuai kesepakatan.","Berkoordinasi antara narahubung, konsultan, dan analis supaya alur layanan berjalan sesuai SOP.","Memeriksa laporan akhir (isi, format, ketepatan tabel dan grafik) sebelum dikirim ke klien.","Mengelola permintaan revisi klien dan memastikan revisi selesai dalam batas waktu yang ditentukan.","Mengevaluasi kinerja proyek dan memberi masukan perbaikan layanan secara berkala."]],
["Agnes Damayanti","Senior Statistical Consultant & Quality Lead",["Memimpin sesi konsultasi dan membantu klien menentukan metode analisis yang sesuai.","Memilih alat uji statistik berdasarkan tujuan penelitian dan karakteristik data.","Memeriksa kualitas data klien (missing value, outlier, kesalahan input) sebelum dianalisis.","Memastikan hasil analisis akurat, asumsi uji terpenuhi, dan interpretasinya mudah dipahami klien.","Membimbing konsultan junior dalam pengolahan data dan penulisan laporan.","Menjaga kerahasiaan dan keamanan data klien, termasuk perjanjian kerahasiaan dan penghapusan data setelah proyek selesai.","Menjaga batas layanan: membantu analisis dan interpretasi, bukan menggantikan pekerjaan akademik klien."]],
["Prince Noel Christian Sitorus","Data Analyst & Visualization Specialist",["Melakukan pengolahan dan analisis data sesuai metode yang ditetapkan konsultan senior.","Melakukan eksplorasi data untuk menemukan pola, tren, dan wawasan yang relevan bagi klien.","Menggunakan software statistik dan bahasa pemrograman (SPSS, R, Python, atau Excel) untuk analisis yang dapat direproduksi.","Menyusun visualisasi data (grafik, tabel, dashboard) yang jelas dan menarik.","Menerjemahkan hasil statistik menjadi insight yang mudah dipahami klien non-statistik.","Mendokumentasikan langkah analisis dan skrip kerja agar hasil dapat diperiksa ulang dan direvisi."]]];

about:()=>hero("About INSIGHTA CONSULTING")+`<section><div class="w ab"><div class="sk">${hd("About Company","Siapa Kami")}<div class="pq">“Akurasi dalam Analisis, Integritas dalam Solusi.”</div></div><div class="tx"><p class="lead">Insighta Consulting merupakan perusahaan konsultan yang berfokus pada penyediaan layanan analisis statistik, konsultasi, dan survei. Kami hadir sebagai mitra dalam membantu individu, peneliti, pelaku usaha, maupun institusi untuk memahami dan memanfaatkan data secara optimal guna mendukung proses pengambilan keputusan.</p><p>Dengan mengedepankan pendekatan berbasis data dan penerapan metode statistika yang tepat, Insighta Consulting berkomitmen untuk menghadirkan solusi yang akurat, relevan, dan aplikatif. Kami tidak hanya berfokus pada proses pengolahan data, tetapi juga membantu klien memahami hasil analisis serta memperoleh informasi yang dapat digunakan untuk menjawab berbagai permasalahan.</p><p>Kami percaya bahwa setiap data memiliki potensi untuk menghasilkan wawasan yang bernilai. Oleh karena itu, Insighta Consulting hadir untuk menjembatani kebutuhan akan informasi dengan pemanfaatan ilmu statistika, sehingga data dapat menjadi dasar dalam menciptakan keputusan dan langkah yang lebih terarah.</p></div></div></section>
<section class="dk"><div class="w g2"><div class="ph" style="max-width:300px">${TEAM_PHOTOS[TEAM[0][0]]?`<img src="${TEAM_PHOTOS[TEAM[0][0]]}" alt="Rama Raditya Handaka" style="width:100%;height:100%;object-fit:cover;object-position:50% 22%">`:"RR<small>Foto menunggu diunggah</small>"}</div><div><div class="ey">Message from the CEO</div><h2>Rama Raditya Handaka</h2><p style="color:var(--gold);font-weight:700">Chief Executive Officer (CEO) & Finance Lead</p><p>INSIGHTA CONSULTING hadir sebagai mitra terpercaya dalam pengelolaan data, mulai dari survei, riset, hingga analisis statistik. Kami mendampingi klien untuk merumuskan masalah, memilih metode yang tepat, dan menggali wawasan bermakna dari setiap data.</p><blockquote style="border-left:3px solid var(--gold);margin:0;padding-left:18px;font-size:20px;font-style:italic">“A good consultant does not just give you the directions, they help you read the map so you can navigate the journey on your own.”</blockquote></div></div></section>
<section><div class="w g2"><div class="ln">${hd("Vision","Visi")}<p>Menjadi lembaga konsultasi data yang dipercaya untuk mengubah data menjadi pemahaman dan keputusan yang tepat bagi semua kalangan.</p></div><div class="ln">${hd("Mission","Misi")}<ol><li>Menyediakan layanan analisis data yang akurat, transparan, dan dapat dipertanggungjawabkan secara metodologis.</li><li>Mendampingi klien memahami data mereka melalui konsultasi yang jelas dan mudah dipahami.</li><li>Melaksanakan survei yang dirancang dan dikelola dengan kaidah ilmiah.</li><li>Membuka akses layanan statistik bagi mahasiswa, masyarakat umum, dan pemerintahan.</li><li>Menjunjung integritas dan etika dengan menjaga kerahasiaan data klien serta kejujuran dalam melaporkan hasil analisis.</li></ol></div></div></section>
<section class="lt"><div class="w">${hd("Organizational Culture","I-N-S-I-G-H-T-A")}<div class="g4" style="margin-top:28px">${VAL.map(([l,n,d])=>`<div class="cd vc"><div class="vl">${l}</div><h3>${n}</h3><p>${d}</p></div>`).join("")}</div></div></section>
<section><div class="w g2"><div>${hd("Institutional Identity","INSIGHTA CONSULTING")}<p><b>Identitas:</b> Statistic Consulting Firm<br><b>Tagline:</b> Transforming Insights into Impact.</p></div><div>${hd("Logo Philosophy","Makna Logo")}<p><b>Inisial “i” dengan titik kuning/keemasan di atas.</b> Melambangkan huruf awal dari “Insighta” sekaligus ide cemerlang, pencerahan (insight), dan fokus utama. Titik emas yang menyerupai bola lampu menyala atau matahari terbit menyimbolkan solusi cerdas yang menjadi mercusuar bagi permasalahan klien.</p><p><b>Grafik batang naik.</b> Melambangkan pertumbuhan (growth), performa bisnis yang meningkat, dan analisis data. Susunan batang yang semakin tinggi ke kanan menggambarkan komitmen Insighta Consulting mendampingi bisnis klien untuk terus berkembang, naik tingkat, dan mencapai target performa terbaiknya.</p><p><b>Garis lengkung dinamis.</b> Melambangkan pergerakan yang progresif, perlindungan, konektivitas global, dan dinamika masa depan. Garis lengkung yang membingkai grafik (kombinasi biru dan aksen emas) mencerminkan jangkauan layanan yang luas, menyeluruh, serta arah strategis yang aman bagi klien.</p></div></div></section>

(()=>{const $=s=>document.querySelector(s),app=$('#app'),hd=document.querySelector('header');
 const bar=document.createElement('div');bar.id='fxp';bar.setAttribute('aria-hidden','true');document.body.prepend(bar);
 const sc=()=>{const h=document.documentElement.scrollHeight-innerHeight,y=scrollY;bar.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';hd.classList.toggle('scrolled',y>12)};
 addEventListener('scroll',sc,{passive:true});addEventListener('resize',sc);addEventListener('hashchange',()=>setTimeout(sc,30));sc();
 const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -4% 0px'}):null;
 const Q='section h2,section .ey,section>.w>p,.ln,div.cd,.vc,.tm,.st,details,.em,.cb,.gt,.pr,.row';
 function scan(){
  let pp=null,n=0;
  document.querySelectorAll(Q).forEach(el=>{if(el.classList.contains('fx')||el.parentElement.closest('.fx,.rv'))return;
   n=el.parentElement===pp?n+1:0;pp=el.parentElement;
   el.classList.add('fx');el.style.setProperty('--d',Math.min(n,5)*80+'ms');io?io.observe(el):el.classList.add('in')});
  setTimeout(()=>document.querySelectorAll('.fx:not(.in)').forEach(e=>{const r=e.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)e.classList.add('in')}),1200)}
 scan();
 new MutationObserver(()=>{app.classList.remove('fxpg');void app.offsetWidth;app.classList.add('fxpg');scan()}).observe(app,{childList:true});
 if(matchMedia('(hover:hover)').matches)addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.ln,div.cd,.vc,.tm');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});

 if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  addEventListener('pointermove',e=>{const h=e.target.closest&&e.target.closest('.hero'),t=document.querySelector('.lg-tilt');if(!t)return;
   if(!h){t.style.transform='';return}const r=h.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width*2-1,dy=(e.clientY-r.top)/r.height*2-1;
   t.style.transform=`perspective(900px) rotateY(${(dx*9).toFixed(1)}deg) rotateX(${(-dy*9).toFixed(1)}deg)`},{passive:true});

})();
